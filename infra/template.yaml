AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BrightEdge Crawler — initial Lambda hello world

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 1024
    Architectures: [x86_64]
    Environment:
      Variables:
        LOG_LEVEL: INFO

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: brightedge-crawler-api
      CodeUri: ../
      Handler: crawler.api.main.handler
      MemorySize: 2048
      Timeout: 28
      Environment:
        Variables:
          PAGES_TABLE: !Ref PagesTable
          JOBS_TABLE: !Ref JobsTable
          RAW_HTML_BUCKET: !Ref RawHtmlBucket
          JOBS_BUCKET: !Ref JobsBucket
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PagesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - S3CrudPolicy: { BucketName: !Ref RawHtmlBucket }
        - S3CrudPolicy: { BucketName: !Ref JobsBucket }
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiBase:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  PagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: brightedge-pages
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: url_hash
          AttributeType: S
        - AttributeName: version
          AttributeType: N
        - AttributeName: domain
          AttributeType: S
        - AttributeName: fetched_at
          AttributeType: S
      KeySchema:
        - AttributeName: url_hash
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-domain
          KeySchema:
            - AttributeName: domain
              KeyType: HASH
            - AttributeName: fetched_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: brightedge-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  RawHtmlBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "brightedge-raw-${AWS::AccountId}-${AWS::Region}"
      LifecycleConfiguration:
        Rules:
          - Id: archive-old
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90

  JobsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "brightedge-jobs-${AWS::AccountId}-${AWS::Region}"

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
