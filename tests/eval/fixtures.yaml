# Labeled fixtures for classifier accuracy evaluation.
#
# Each case references a fixture HTML file in tests/fixtures/ and lists the
# topics a human reviewer would expect.
#
# expected_top_3: the labels we expect to see at ranks 1-3. Used to compute
#                 top-1 hit and top-3 hit rate.
# relevant:       a broader set used to compute MRR (rank of first relevant
#                 label among the actual top-10).
#
# Matching is case-insensitive with token-set intersection plus substring
# fallback, so "outdoor" matches "outdoors" and "kitchen" matches
# "kitchen toaster". See _matches() in test_topic_accuracy.py.
#
# Non-English fixtures use source-language labels (matcher is language-agnostic).

